name: Testing

# Triggered manually only; the optional test-filter input scopes the suite.
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional -run regexp to scope the test suite'
        required: false
        default: ''

permissions:
  contents: read

# Always force the use of Go modules
env:
  GO111MODULE: on

jobs:
  # Check generated protos match their source repos (optional for PRs).
  # Disabled: this static check regenerates the protos from the upstream proto
  # repositories at their current HEAD, which have moved on since the v1.43.0
  # release, so it reports drift unrelated to this build.
  vet-proto:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Setup the environment.
      - name: Setup Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.15
      - name: Checkout repo
        uses: actions/checkout@v2

      # Run the vet checks.
      - name: vet
        run: ./vet.sh -install && ./vet.sh

  # Build the released Go module zip (google.golang.org/grpc v1.43.0) and
  # upload it as a workflow artifact.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.17

      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Build module zip
        run: |
          set -eux
          cp -r "${GITHUB_WORKSPACE}" /tmp/modsrc
          rm -rf /tmp/modsrc/.git
          mkdir -p /tmp/zipper /tmp/out
          cd /tmp/zipper
          cat > main.go <<'EOF'
          package main

          import (
              "log"
              "os"

              "golang.org/x/mod/module"
              "golang.org/x/mod/zip"
          )

          func main() {
              out, err := os.Create(os.Args[3])
              if err != nil {
                  log.Fatal(err)
              }
              defer out.Close()
              v := module.Version{Path: "google.golang.org/grpc", Version: os.Args[1]}
              if err := zip.CreateFromDir(out, v, os.Args[2]); err != nil {
                  log.Fatal(err)
              }
          }
          EOF
          go mod init zipper
          GOFLAGS=-mod=mod go get golang.org/x/mod@v0.8.0
          GOFLAGS=-mod=mod go run . v1.43.0 /tmp/modsrc /tmp/out/v1.43.0.zip
          ls -l /tmp/out

      - name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: /tmp/out/v1.43.0.zip
          if-no-files-found: error

  # Run the main gRPC-Go tests.
  tests:
    # Proto checks are run in the above job.
    env:
      VET_SKIP_PROTO: 1
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - type: vet+tests
            goversion: 1.17

          - type: tests
            goversion: 1.17
            testflags: -race

          - type: extras
            goversion: 1.17

          - type: tests
            goversion: 1.17
            goarch: 386

          - type: tests
            goversion: 1.17
            goarch: arm64

          - type: tests
            goversion: 1.16

          - type: tests
            goversion: 1.15

          # Windows leg (seal addition). Go 1.18 because Go 1.17's
          # x509.SystemCertPool() is unimplemented on Windows (credentials/sts
          # fails); x509sha1=1 because Go 1.18 rejects the SHA1-signed test
          # certificates that Go <= 1.17 accepted; 20m per-package timeout
          # because the test package's localhost dials are slower on Windows.
          - type: tests
            goversion: 1.18
            runner: windows-latest
            grpcenv: GODEBUG=x509sha1=1
            gotimeout: 20m

    steps:
      # Setup the environment.
      - name: Setup GOARCH
        if: matrix.goarch != ''
        shell: bash
        run: echo "GOARCH=${{ matrix.goarch }}" >> $GITHUB_ENV

      - name: Setup qemu emulator
        if: matrix.goarch == 'arm64'
        # setup qemu-user-static emulator and register it with binfmt_misc so that aarch64 binaries
        # are automatically executed using qemu.
        run: docker run --rm --privileged multiarch/qemu-user-static:5.2.0-2 --reset --credential yes --persistent yes

      # The ThreadSanitizer runtime bundled with Go < 1.21 cannot handle the
      # 32-bit mmap ASLR entropy of current ubuntu-latest kernels ("unexpected
      # memory mapping"); restore the 28-bit default the race detector expects.
      - name: Setup race detector ASLR
        if: matrix.testflags == '-race'
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Setup GRPC environment
        if: matrix.grpcenv != ''
        shell: bash
        run: echo "${{ matrix.grpcenv }}" >> $GITHUB_ENV

      - name: Setup Go
        uses: actions/setup-go@v2
        with:
          go-version: ${{ matrix.goversion }}

      - name: Checkout repo
        uses: actions/checkout@v2

      # Only run vet for 'vet' runs.
      # Disabled: vet.sh is a lint gate (gofmt/goimports/golint/staticcheck),
      # and `vet.sh -install` fetches the linters at their current versions,
      # which no longer build with Go 1.17. It executes no tests.
      - name: Run vet.sh
        if: false
        shell: bash
        run: ./vet.sh -install && ./vet.sh

      # gotestsum wraps the unchanged `go test` arguments (after `--`) and
      # prints per-package results plus a final "DONE N tests, M skipped"
      # summary that lists every skipped test with its skip message, which a
      # plain `go test` run never prints. The prebuilt host binary is used
      # because `go install` of it needs a newer Go than the 1.15/1.16 legs.
      - name: Install gotestsum
        if: contains(matrix.type, 'tests')
        shell: bash
        run: |
          set -eux
          case "${RUNNER_OS}" in
            Windows) OS=windows ;;
            *) OS=linux ;;
          esac
          mkdir -p "${RUNNER_TEMP}/gotestsum"
          # extract from inside the dir: GNU tar reads a `D:\...` -C path as a remote host
          cd "${RUNNER_TEMP}/gotestsum"
          curl -sSfL "https://github.com/gotestyourself/gotestsum/releases/download/v1.12.0/gotestsum_1.12.0_${OS}_amd64.tar.gz" | tar -xz
          echo "${RUNNER_TEMP}/gotestsum" >> $GITHUB_PATH

      # Main tests run for everything except when testing "extras"
      # (where we run a reduced set of tests).
      - name: Run tests
        if: contains(matrix.type, 'tests')
        shell: bash
        run: |
          go version
          GOTESTSUM="gotestsum --format standard-quiet --"
          if [ -n "${{ inputs.test-filter }}" ]; then
            # The dispatch input cannot carry '|', so the selector uses ',' as
            # the alternation separator; translate it back to a -run regexp.
            RUN_RE=$(printf '%s' '${{ inputs.test-filter }}' | tr ',' '|')
            echo "Scoped test run: -run ${RUN_RE}"
            ${GOTESTSUM} ${{ matrix.testflags }} -cpu 1,4 -timeout ${{ matrix.gotimeout || '7m' }} -run "${RUN_RE}" google.golang.org/grpc/...
          else
            ${GOTESTSUM} ${{ matrix.testflags }} -cpu 1,4 -timeout ${{ matrix.gotimeout || '7m' }} google.golang.org/grpc/...
            cd "${GITHUB_WORKSPACE}/security/advancedtls" && ${GOTESTSUM} ${{ matrix.testflags }} -timeout 2m google.golang.org/grpc/security/advancedtls/...
            cd "${GITHUB_WORKSPACE}/security/authorization" && ${GOTESTSUM} ${{ matrix.testflags }} -timeout 2m google.golang.org/grpc/security/authorization/...
          fi


      # Non-core gRPC tests (examples, interop, etc)
      - name: Run extras tests
        if: matrix.type == 'extras' && inputs.test-filter == ''
        run: |
          go version
          examples/examples_test.sh
          security/advancedtls/examples/examples_test.sh
          interop/interop_test.sh
          xds/internal/test/e2e/run.sh
