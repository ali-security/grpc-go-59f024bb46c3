name: 'Lock Threads'

# Seal fork: manual dispatch only (schedule trigger removed).
on:
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@v2
        with:
          github-token: ${{ github.token }}
          issue-lock-inactive-days: 180
          pr-lock-inactive-days: 180
